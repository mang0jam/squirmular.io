<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squirmular.io — Grow · Survive · Thrive</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100dvw; height: 100dvh; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10;
  }
  #title {
    font-family: 'Patrick Hand SC', cursive;
    font-size: clamp(2.5rem, 7vw, 5rem);
    color: #dcc490;
    letter-spacing: 0.15em;
    margin-bottom: 0.2em;
  }
  #subtitle {
    font-family: monospace;
    font-size: clamp(0.55rem, 1.4vw, 0.8rem);
    color: #555;
    letter-spacing: 0.35em;
    margin-bottom: 0.4em;
  }
  #solid-label {
    position: fixed; bottom: 2rem; right: 2.5rem;
    font-family: 'Patrick Hand SC', cursive;
    font-size: 1.3rem;
    color: rgba(100, 200, 180, 0);
    letter-spacing: 0.1em;
    pointer-events: none; z-index: 10;
  }
  #logo {
    position: fixed; bottom: 0; left: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding-bottom: clamp(2rem, 5vh, 4rem);
    pointer-events: none; z-index: 10;
  }
  #logo-title {
    font-family: 'Patrick Hand SC', cursive;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    color: #dcc490;
    letter-spacing: 0.15em;
    margin-bottom: 0.15em;
  }
  #logo-sub {
    font-family: monospace;
    font-size: clamp(0.5rem, 1.2vw, 0.75rem);
    color: #555;
    letter-spacing: 0.35em;
    margin-bottom: 0.5em;
  }
  #logo-seed { opacity: 0.22; }
  /* The single call to action. Everything else on the page is thin gold line
     work on near-black, so a SOLID gold fill is what makes this read as a
     button at a glance rather than one more line of the wordmark lockup. */
  #play {
    pointer-events: auto;              /* #logo above is pointer-events:none */
    margin-top: clamp(1.1rem, 3vh, 1.9rem);
    display: inline-flex; align-items: center; gap: 0.45em;
    padding: 0.5em 1.5em 0.55em;
    font-family: 'Patrick Hand SC', cursive;
    font-size: clamp(1.5rem, 3.6vw, 2.3rem);
    line-height: 1;
    letter-spacing: 0.18em; text-indent: 0.18em;  /* offset the trailing track */
    color: #0a0a0a; text-decoration: none; white-space: nowrap;
    background: linear-gradient(180deg, #f2e0ac, #d6b97c);
    border-radius: 999px;
    box-shadow: 0 0 0 1px rgba(220, 196, 144, 0.55);
    /* Pulse lives on `filter` so it can't fight the hover box-shadow. */
    animation: play-pulse 2.6s ease-in-out infinite;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  #play:hover, #play:focus-visible {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 0 1px rgba(220, 196, 144, 0.9), 0 0 46px rgba(220, 196, 144, 0.45);
  }
  #play:active { transform: translateY(0) scale(0.99); }
  #play:focus-visible { outline: 2px solid #dcc490; outline-offset: 5px; }
  #play svg { margin-top: 0.04em; }
  @keyframes play-pulse {
    0%, 100% { filter: drop-shadow(0 0 9px rgba(220, 196, 144, 0.22)); }
    50%      { filter: drop-shadow(0 0 24px rgba(220, 196, 144, 0.5)); }
  }
  @media (prefers-reduced-motion: reduce) { #play { animation: none; } }
  #coming-soon {
    position: fixed; bottom: 0.8rem; left: 50%; transform: translateX(-50%);
    font-family: monospace;
    font-size: clamp(0.45rem, 1vw, 0.6rem);
    color: #333;
    letter-spacing: 0.3em;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="logo">
  <div id="logo-title">SQUIRMULAR</div>
  <div id="logo-sub">GROW · SURVIVE · THRIVE</div>
  <svg id="logo-seed" width="40" height="40" viewBox="-20 -20 40 40">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#dcc490" stroke-width="0.8"/>
    <circle cx="0" cy="-8" r="8" fill="none" stroke="#dcc490" stroke-width="0.8"/>
    <circle cx="6.9" cy="-4" r="8" fill="none" stroke="#dcc490" stroke-width="0.8"/>
    <circle cx="6.9" cy="4" r="8" fill="none" stroke="#dcc490" stroke-width="0.8"/>
    <circle cx="0" cy="8" r="8" fill="none" stroke="#dcc490" stroke-width="0.8"/>
    <circle cx="-6.9" cy="4" r="8" fill="none" stroke="#dcc490" stroke-width="0.8"/>
    <circle cx="-6.9" cy="-4" r="8" fill="none" stroke="#dcc490" stroke-width="0.8"/>
  </svg>
  <!-- Where PLAY goes. Single source of truth for the game URL.
       TEMP: bare Fly host until the play.squirmular.io CNAME lands at
       Namecheap (CNAME, Host `play`, Value `squirmular.fly.dev.`). -->
  <a id="play" href="https://squirmular.fly.dev/">
    <svg width="16" height="19" viewBox="0 0 16 19" aria-hidden="true" focusable="false">
      <path d="M1.5 1 L15 9.5 L1.5 18 Z" fill="currentColor"/>
    </svg>PLAY</a>
</div>
<script>
  // Per-domain branding: the legacy swarmular.io keeps the old wordmark,
  // every other host (squirmular.io, localhost, *.github.io) gets the new one.
  // Runs inline right after the wordmark is parsed, so there is no flash.
  (function () {
    if (!/(^|\.)swarmular\./i.test(location.hostname)) return;
    document.title = 'Swarmular.io — Grow · Survive · Thrive';
    var t = document.getElementById('logo-title');
    if (t) t.textContent = 'SWARMULAR';
  })();
</script>
<div id="coming-soon">COMING SOON</div>

<script src="app.js"></script>
</body>
</html>
